spring.application.name=sportschool
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/sportschool}
spring.datasource.username=${DATABASE_USER:sportschool}
spring.datasource.password=${DATABASE_PASSWORD:SportSchoolLocal2026}
spring.jackson.time-zone=America/Lima
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.error.include-message=never
spring.datasource.hikari.maximum-pool-size=10
