services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: sportschool
      POSTGRES_USER: sportschool
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-SportSchoolLocal2026}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportschool"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
